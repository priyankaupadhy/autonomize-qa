# azure-pipelines.yml
# Runs all QA tests automatically on every code push

trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

steps:

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"
    displayName: "Setup Python 3.11"

  - script: pip install -r requirements.txt
    displayName: "Install Dependencies"

  - script: pytest tests/ -v --html=reports/report.html --self-contained-html
    displayName: "Run All Tests"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "reports"
      ArtifactName: "QA-Reports"
    displayName: "Upload Test Report"